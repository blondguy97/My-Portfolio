<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico">
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Github app</title>
</head>

<body>
    <div class="container">
        <h1>Поиск пользователей в Github</h1>

        <form class="search-form" data-search-form>
            <input class="search-input" type="text" data-search-input placeholder="Ник пользователя в Github...">

            <button type="submit" class="search-btn">Поиск</button>
        </form>

        <div class="user-info-container" data-user-info-container></div>
        <div class="repos-container" data-repos-container></div>
    </div>
</body>

</html>
