<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico">
    <script src="main.js" defer></script>
    <title>Exchange Rates</title>
</head>

<body>

    <a style="display: none;" href="https://www.exchangerate-api.com">Rates By Exchange Rate API</a>

    <div class="container">
        <img src="logo.svg" class="logo" loading="lazy" alt="logo">
        <h1 class="title">Exchange Rates</h1>

        <section class="info-container">
            <div class="controls-wrapper">
                <select class="select-control" name="first-select" data-first-select>
                </select>
                <button class="swap-btn" data-swap-btn>Поменять местами</button>
                <select class="select-control" name="second-select" data-second-select>
                </select>

            </div>
        </section>
        <p class="comparison" data-comparison-info></p>
    </div>




</body>

</html>
